# Copy this file to .github/workflows/ai-model-sunset.yml in your repository.
# Every Monday it looks for OpenAI and Anthropic models that are being switched off,
# and opens an issue when one shuts down within 60 days.
name: AI model sunset check
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ericc2005t/ai-model-sunset@v1
        with:
          issue-days: 60
